
name: Build REALITY AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Diagnose project structure
        run: |
          echo "=== ROOT DIRECTORY ==="
          pwd
          ls -la
          echo "=== ANDROID BUILD FILES ==="
          find . -maxdepth 5 -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \)

      - name: Build APK
        working-directory: RealityAI-Android
        run: gradle testDebugUnitTest assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: REALITY-AI-APK
          path: RealityAI-Android/app/build/outputs/apk/debug/*.apk
